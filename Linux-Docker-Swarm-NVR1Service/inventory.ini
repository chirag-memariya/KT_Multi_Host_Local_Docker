[swarm_managers]
swarm-manager ansible_host=127.0.0.1 ansible_port=2221 ansible_user=ansible ansible_password=ansible ansible_become_password=ansible swarm_node_ip=10.10.0.11

[swarm_workers]
swarm-worker-1 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible ansible_password=ansible ansible_become_password=ansible swarm_node_ip=10.10.0.21
swarm-worker-2 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=ansible ansible_password=ansible ansible_become_password=ansible swarm_node_ip=10.10.0.22

[swarm_nodes:children]
swarm_managers
swarm_workers

[all:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'