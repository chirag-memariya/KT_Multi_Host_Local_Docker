version: '3.8'

services:
  hello-service:
    image: ${APP_IMAGE:-alpine:3.20}
    command:
      - /bin/sh
      - -c
      - while true; do echo "hello from swarm $$(hostname)"; sleep 10; done
    deploy:
      replicas: ${STACK_REPLICAS:-3}
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure