---
- name: Deploy NVR1Service locally on Linux hosts
  hosts: nvr1service_nodes
  become: true
  vars:
    app_name: nvr1service
    app_root: /opt/nvr1service
    app_source_dir: /opt/nvr1service/src
    app_publish_dir: /opt/nvr1service/current
    service_user: nvr1service
    source_dir: "{{ playbook_dir }}/../Demo/NVR1Service"
    rabbitmq_host: rabbitmq.local
    rabbitmq_port: 5672

  handlers:
    - name: Restart nvr1service
      ansible.builtin.systemd:
        name: nvr1service
        state: restarted

  tasks:
    - name: Install Linux packages required for .NET repository setup
      ansible.builtin.apt:
        name:
          - wget
          - gpg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Download Microsoft package repository definition
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
        dest: /tmp/packages-microsoft-prod.deb
        mode: '0644'

    - name: Register Microsoft package repository
      ansible.builtin.apt:
        deb: /tmp/packages-microsoft-prod.deb

    - name: Install .NET 8 SDK
      ansible.builtin.apt:
        name: dotnet-sdk-8.0
        state: present
        update_cache: true

    - name: Ensure service user exists
      ansible.builtin.user:
        name: "{{ service_user }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: '0755'
      loop:
        - "{{ app_root }}"
        - "{{ app_source_dir }}"
        - "{{ app_publish_dir }}"

    - name: Copy NVR1Service source to Linux hosts
      ansible.builtin.copy:
        src: "{{ source_dir }}/"
        dest: "{{ app_source_dir }}/"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: preserve
      notify: Restart nvr1service

    - name: Publish NVR1Service
      ansible.builtin.command:
        cmd: dotnet publish {{ app_source_dir }}/NVR1Service.csproj -c Release -o {{ app_publish_dir }}
      notify: Restart nvr1service

    - name: Install systemd unit for NVR1Service
      ansible.builtin.template:
        src: templates/nvr1service.service.j2
        dest: /etc/systemd/system/nvr1service.service
        mode: '0644'
      notify: Restart nvr1service

    - name: Enable and start NVR1Service
      ansible.builtin.systemd:
        name: nvr1service
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers