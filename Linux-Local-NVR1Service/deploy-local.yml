---
- name: Deploy NVR1Service locally on Linux hosts
  hosts: nvr1service_nodes
  become: true
  become_method: sudo
  vars_prompt:
    - name: ansible_become_password
      prompt: Enter sudo password for local Linux host
      private: true
  vars:
    app_name: nvr1service
    app_root: /opt/nvr1service
    app_publish_dir: /opt/nvr1service/current
    service_user: nvr1service
    source_dir: "{{ playbook_dir }}/../NVR1Service-publish"
    rabbitmq_host: rabbitmq.local
    rabbitmq_port: 5672

  handlers:
    - name: Restart nvr1service
      ansible.builtin.systemd:
        name: nvr1service
        state: restarted

  tasks:
    - name: Check dotnet is installed locally
      ansible.builtin.command: dotnet --info
      register: dotnet_info
      changed_when: false

    - name: Ensure service user exists
      ansible.builtin.user:
        name: "{{ service_user }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: '0755'
      loop:
        - "{{ app_root }}"
        - "{{ app_publish_dir }}"

    - name: Copy pre-published NVR1Service to target host
      ansible.builtin.copy:
        src: "{{ source_dir }}/"
        dest: "{{ app_publish_dir }}/"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: preserve
      notify: Restart nvr1service

    - name: Install systemd unit for NVR1Service
      ansible.builtin.template:
        src: templates/nvr1service.service.j2
        dest: /etc/systemd/system/nvr1service.service
        mode: '0644'
      notify: Restart nvr1service

    - name: Enable and start NVR1Service
      ansible.builtin.systemd:
        name: nvr1service
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers